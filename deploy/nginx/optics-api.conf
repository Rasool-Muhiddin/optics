# /etc/nginx/sites-available/optics-api  →  ln -s into sites-enabled
# Optics API (optics-api.tera-software1.com) behind Cloudflare (SSL mode "Full (strict)").
# Independent of the pharmacy site: own server_name, own upstream socket, own folders.

upstream optics_api {
    server unix:/run/optics/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name optics-api.tera-software1.com;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 ships nginx 1.24: `http2` goes on the listen line.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name optics-api.tera-software1.com;

    # Cloudflare Origin Certificate (SSL/TLS → Origin Server → Create certificate).
    ssl_certificate     /etc/ssl/cloudflare/optics-api.pem;
    ssl_certificate_key /etc/ssl/cloudflare/optics-api.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/optics-api.access.log;
    error_log  /var/log/nginx/optics-api.error.log;

    # Desktop installers are uploaded through the Django admin.
    client_max_body_size 300m;

    # collectstatic output (Django admin assets).
    location /static/ {
        alias /srv/optics/static/;
        expires 30d;
        access_log off;
    }

    # Uploaded files: lab logos and desktop installers (public by design: the app downloads
    # installers before login and verifies their SHA-256).
    location /media/ {
        alias /srv/optics/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
        location ~* \.(php|py|sh)$ { deny all; }
    }

    location / {
        proxy_pass http://optics_api;
        proxy_set_header Host $host;
        # Django believes these only from trusted hops (TRUSTED_PROXIES = loopback + Cloudflare).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
