# nginx site for the Optics API. TEMPLATE: deploy/setup-server.sh fills in
#   __DOMAIN__    e.g. optics-api.tera-software1.com
#   __SSL_CERT__  Cloudflare Origin cert (/etc/ssl/cloudflare/optics-api.pem) or
#                 Let's Encrypt (/etc/letsencrypt/live/<domain>/fullchain.pem)
#   __SSL_KEY__   matching private key
# and writes it to /etc/nginx/sites-available/optics-api (symlinked into sites-enabled).
# Independent of the pharmacy site: own server_name, own upstream socket, own folders.

upstream optics_api {
    server unix:/run/optics/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt HTTP-01 challenges (unused with a Cloudflare Origin certificate).
    location /.well-known/acme-challenge/ {
        root /var/www/optics-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 ships nginx 1.24: `http2` goes on the listen line.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:optics_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    access_log /var/log/nginx/optics-api.access.log;
    error_log  /var/log/nginx/optics-api.error.log;

    # Desktop installers are uploaded through the Django admin. (Behind Cloudflare's free plan
    # a single request is capped at 100 MB anyway; installers are ~20–40 MB.)
    client_max_body_size 300m;

    # JSON lists (inventory, patients) compress very well; installers (.exe) are left alone.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # collectstatic output (Django admin assets).
    location /static/ {
        alias /srv/optics/static/;
        expires 30d;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    # Uploaded files: lab logos and desktop installers (public by design: the app downloads
    # installers before login and verifies their SHA-256).
    location /media/ {
        alias /srv/optics/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        location ~* \.(php|py|sh|html?|svg)$ { deny all; }
    }

    # Everything else → Django (which sets HSTS, nosniff, X-Frame-Options, Referrer-Policy).
    location / {
        proxy_pass http://optics_api;
        proxy_set_header Host $host;
        # Django believes these only from trusted hops (TRUSTED_PROXIES = loopback + Cloudflare).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
